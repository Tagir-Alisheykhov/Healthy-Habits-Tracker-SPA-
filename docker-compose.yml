services:

  db:
    image: postgres:15.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data/
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 1s
      retries: 5

  backend:
    image: ${DOCKER_HUB_USERNAME}/healthy_habits_tracker:${GITHUB_SHA}
    command: bash -c "python manage.py migrate && gunicorn --workers=4 --threads=2 --timeout=60 --bind 0.0.0.0:8000 config.wsgi:application""
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      REDIS_LOCATION: ${REDIS_LOCATION}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - django_static:/app/static/
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

  web:
     image: nginx:1.19.3
     ports:
       - "80:80"
     depends_on:
       backend:
        condition: service_started
     volumes:
       - ./nginx.conf:/etc/nginx/conf.d/default.conf
       - django_static:/usr/share/nginx/html/static/

  celery_worker:
    user: "1000:1000"
    environment:
      - C_FORCE_ROOT=0
    image: ${DOCKER_HUB_USERNAME}/healthy_habits_tracker:${GITHUB_SHA}
    command: celery -A config worker -l INFO
    volumes:
      - media:/app/media
    depends_on:
      - redis
      - db
    env_file:
      - .env
    restart: always
    healthcheck:
      test: celery -A config inspect ping
      interval: 30s
      timeout: 10s
      retries: 3

  celery_beat:
    image: ${DOCKER_HUB_USERNAME}/healthy_habits_tracker:${GITHUB_SHA}
    command: celery -A config beat -l INFO
    volumes:
      - media:/app/media
    depends_on:
      - redis
      - db
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ps aux | grep -v grep | grep celery.beat
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:

volumes:
  pg_data:
  django_static:
  redis_data:
  media:
