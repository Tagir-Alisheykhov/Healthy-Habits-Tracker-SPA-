name: CICD Django Project.

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ hashFiles('**/Dockerfile*') }}
    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/healthy_habits_tracker:${{ github.sha }} .
    - name: Start services with Docker Compose
      run: |
        cat > .env <<EOL
        POSTGRES_DB=healthy_habits_tracker
        POSTGRES_USER=postgres
        POSTGRES_PASSWORD=password
        POSTGRES_HOST=db
        POSTGRES_PORT=5432
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        DEBUG=False
        DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
        REDIS_BACKEND=${{ secrets.REDIS_BACKEND }}
        REDIS_LOCATION=${{ secrets.REDIS_LOCATION }}
        CORS_FRONTEND=http://localhost:8000,http://89.169.187.28:8000
        CORS_ALLOW_ALL_ORIGINS=False
        EOL
        docker compose up -d --build
        echo "Waiting a moment for services to initialize..."
        sleep 10
        echo "=== Docker Compose Status ==="
        docker compose ps
        echo "=== DB Logs ==="
        docker compose logs db
        echo "=== Redis Logs ==="
        docker compose logs redis
        echo "=== Backend Logs ==="
        docker compose logs backend || echo "Backend logs not available or service not started"
        docker compose logs db
        docker compose logs redis

    - name: Wait for PostgreSQL to be ready
      run: |
        echo "Checking PostgreSQL health..."
        for i in {1..30}; do
          if [ $(docker compose ps -q db) ] && \
             [ "$(docker inspect -f '{{.State.Health.Status}}' $(docker compose ps -q db))" = "healthy" ]; then
            echo "PostgreSQL is ready!"
            exit 0
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 5
        done
        echo "PostgreSQL failed to start"
        docker compose logs db
        exit 1
    - name: Wait for Redis to be ready
      run: |
        echo "Checking Redis container status..."
        docker compose ps
        
        echo "Waiting for Redis to be healthy..."
        for i in {1..30}; do
          container_id=$(docker compose ps -q redis)
          if [ -n "$container_id" ] && \
             [ "$(docker inspect -f '{{.State.Health.Status}}' $container_id)" = "healthy" ]; then
            echo "Redis is ready!"
            docker compose exec redis redis-cli ping
            exit 0
          fi
          echo "Waiting for Redis... ($i/30)"
          sleep 2
        done
        echo "Redis failed to become healthy"
        docker compose logs redis
        exit 1
    - name: Run tests
      run: |
        docker compose exec backend python manage.py test
    - name: Stop services
      run: docker compose down

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Log in in Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/healthy_habits_tracker:${{ github.sha }} .
      - name: Push Docker image in Docker hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/healthy_habits_tracker:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Deploy to server
        run: |
          cat > .env <<EOL
          POSTGRES_DB=${{ secrets.DB_NAME }}
          POSTGRES_USER=${{ secrets.DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_HOST=${{ secrets.DB_HOST }}
          POSTGRES_PORT=${{ secrets.DB_PORT }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=${{ secrets.SECRET_KEY }}
          REDIS_BACKEND=${{ secrets.REDIS_BACKEND }}
          REDIS_LOCATION=${{ secrets.REDIS_LOCATION }}
          DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
          CORS_FRONTEND=http://localhost:8000,http://89.169.187.28:8000,http://127.0.0.1:8000
          CORS_BACKEND=${{ secrets.CORS_BACKEND }}
          CORS_ALLOW_ALL_ORIGINS=${{ secrets.CORS_ALLOW_ALL_ORIGINS }}
          CELERY_URL=${{ secrets.CELERY_URL }}
          GITHUB_SHA=${{ github.sha }}            
          EOL
          scp -o StrictHostKeyChecking=no docker-compose.yml .env ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/var/www/healthy_habits_tracker/
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          mkdir -p /var/www/healthy_habits_tracker/
          cd /var/www/healthy_habits_tracker/
          docker compose down || true
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/healthy_habits_tracker:${{ github.sha }}
          docker compose up -d
          EOF


#          sudo systemctl daemon-reload
#          sudo systemctl restart healthy_habits_tracker